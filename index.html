<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>敬请关注</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f6f8fa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }

    /* 全屏 Canvas 作为特效背景 */
    #trail-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none; /* 穿透鼠标事件，不影响文字选择与点击 */
      z-index: 10;
    }

    /* 页面上的文字内容 */
    .hero-content {
      position: relative;
      z-index: 20;
      user-select: none;
    }

    h1 {
      font-size: 4rem;
      font-weight: 800;
      color: #1f2328;
    }
  </style>
</head>
<body>

  <div class="hero-content">
    <h1>敬请关注 /</h1>
  </div>

  <!-- 渲染拖尾的 Canvas -->
  <canvas id="trail-canvas"></canvas>

  <script>
    const canvas = document.getElementById('trail-canvas');
    const ctx = canvas.getContext('2d');

    // 适配高清屏幕 (Retina)
    let dpr = window.devicePixelRatio || 1;
    function resizeCanvas() {
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      ctx.scale(dpr, dpr);
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // GitHub 风格的调色板 (粉红、浅紫、嫩绿、深蓝、金黄等)
    const COLORS = [
      '#FF3366', '#A371F7', '#56D364', '#388BFD', 
      '#F2CC60', '#8957E5', '#2EA043'
    ];

    // 随机代码字符库
    const CHARACTERS = [')', '(', '{', '}', ';', '=', '+', '>', '<', ':', '•', '~'];

    // 存放当前存活的所有像素块
    const particles = [];

    // 单个方块粒子类
    class Particle {
      constructor(x, y) {
        // 让方块对齐到近似的网格上，体现像素/终端风
        this.size = 28; // 方块初始基础大小
        this.x = Math.round((x - this.size / 2) / 8) * 8;
        this.y = Math.round((y - this.size / 2) / 8) * 8;

        this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
        // 50% 概率包含一个代码字符
        this.char = Math.random() > 0.4 ? CHARACTERS[Math.floor(Math.random() * CHARACTERS.length)] : '';
        
        this.life = 1.0;     // 生命值 1.0 -> 0
        this.decay = 0.025;  // 衰减速度（控制拖尾长度）
      }

      update() {
        this.life -= this.decay;
      }

      draw() {
        if (this.life <= 0) return;

        // 根据生命周期实现：缩小 + 淡出
        const currentSize = this.size * Math.max(this.life, 0.1);
        const offset = (this.size - currentSize) / 2;

        ctx.save();
        ctx.globalAlpha = Math.min(this.life * 1.2, 1); // 透明度平滑

        // 1. 绘制彩色方块背景
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x + offset, this.y + offset, currentSize, currentSize);

        // 2. 绘制方块正中心的字符（如果有且尺寸足够大）
        if (this.char && currentSize > 14) {
          ctx.fillStyle = '#000000'; // 字符颜色（黑色/深灰）
          ctx.font = `bold ${Math.floor(currentSize * 0.55)}px monospace`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(
            this.char, 
            this.x + offset + currentSize / 2, 
            this.y + offset + currentSize / 2
          );
        }

        ctx.restore();
      }
    }

    // 鼠标移动检测
    let lastX = 0;
    let lastY = 0;
    const MIN_DISTANCE = 16; // 限制生成间距，避免静止时过度重叠

    window.addEventListener('mousemove', (e) => {
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      const dist = Math.sqrt(dx * dx + dy * dy);

      // 仅在移动距离超过阈值时生成新块
      if (dist > MIN_DISTANCE) {
        particles.push(new Particle(e.clientX, e.clientY));
        lastX = e.clientX;
        lastY = e.clientY;
      }
    });

    // 动画循环 (60fps/120fps)
    function animate() {
      // 清理上一帧（逻辑像素大小）
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

      // 更新并绘制所有方块
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update();
        p.draw();

        // 移除死掉的粒子，防止内存泄漏
        if (p.life <= 0) {
          particles.splice(i, 1);
        }
      }

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
